x-logging: &logging
  driver: json-file
  options:
    max-size: "1000m"
    max-file: "3"

services:
  backend:
    build: ./Backend
    image: quizdeck-backend
    restart: unless-stopped
    env_file: ./Backend/.env.production
    ports:
      - "127.0.0.1:4000:3000"
    logging: *logging

  frontend:
    build: ./Frontend
    image: quizdeck-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    logging: *logging:3000"